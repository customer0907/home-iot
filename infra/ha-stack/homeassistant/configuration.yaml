default_config:

input_boolean:
  tars_light:
    name: TARS 불 제어
    initial: off
    icon: mdi:lightbulb

light:
  - platform: template
    lights:
      tars_light:
        friendly_name: "TARS 조명"
        unique_id: "tars_jomyeong_001"
        value_template: "{{ is_state('input_boolean.tars_light', 'on') }}"
        turn_on:
          service: input_boolean.turn_on
          target:
            entity_id: input_boolean.tars_light
        turn_off:
          service: input_boolean.turn_off
          target:
            entity_id: input_boolean.tars_light

mqtt:

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

frontend:
  themes: !include_dir_merge_named themes

rest_command:
  discord_notify:
    url: !secret discord_webhook_url
    method: POST
    content_type: "application/json"
    payload: '{"content": {{ message | tojson }} }'
